# 仅用于本机无 MySQL 时的自测启动，不代表生产配置。
# 启动：AES_KEY=<base64-32字节> java -jar target/data-model-backend.jar --spring.profiles.active=local
spring:
  datasource:
    url: jdbc:h2:mem:data_model;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TYPE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

logging:
  level:
    com.datamodel: debug
